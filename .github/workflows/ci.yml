name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # CyberAlertTests exercises the live digital.nhs.uk API, which Cloudflare blocks for
    # GitHub Actions runners (403 challenge page) and which would also cost Actions minutes
    # on every push. Sibling API-wrapper repos (Auvik.Api, HubSpot.Api, Cisco.Api,
    # Datadog.Api, Jira.Api) likewise don't run tests here; run this suite locally instead.

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages
        path: ./artifacts/*.nupkg

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: packages
        path: ./artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.x

    - name: Login to NuGet
      id: login
      uses: NuGet/login@v1
      with:
        user: david_n_m_bond

    - name: Push to NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  # pdl-public, not a GitHub-hosted runner: this repository is public and the hardened scale set
  # has no dind, no privileged container and no hostPath.
  coverage:
    runs-on: [pdl-public]
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # The runner user cannot write /usr/share/dotnet, so the SDK goes under the job's temp directory.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 11.0.x

    # The live tests call digital.nhs.uk, which blocks CI runners, and carry Category=Integration.
    - name: Run tests with coverage
      run: >-
        dotnet test --project Uk.Nhs.Api.Test/Uk.Nhs.Api.Test.csproj
        --filter-not-trait "Category=Integration"
        --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

    # continue-on-error: a Codacy outage must not turn a passing test run red. An expired or
    # missing project token fails silently, so check the log for "Coverage received successfully".
    - name: Upload coverage to Codacy
      continue-on-error: true
      uses: codacy/codacy-coverage-reporter-action@v1
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: '**/coverage.cobertura.xml'
